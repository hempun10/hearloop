name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  kane:
    # Replays the designed Kane tests against a local app with a fresh D1 database.
    # Needs repository secrets LT_USERNAME and LT_ACCESS_KEY (LambdaTest / TestMu AI).
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/web
    env:
      KANE_CLI_USER_AGENT: github-actions
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npm install -g @testmuai/kane-cli@latest
      - name: Local secrets for the dev server
        run: printf 'BETTER_AUTH_SECRET=%s\nBETTER_AUTH_URL=http://localhost:3000\n' "$(openssl rand -hex 32)" > .dev.vars
      - run: bun run db:migrate
      - name: Start the app
        run: |
          nohup bun run dev > dev.log 2>&1 &
          npx --yes wait-on -t 120000 http://localhost:3000
      - run: bun run e2e:seed
      - name: Sign in to Kane
        run: kane-cli login --username "${{ secrets.LT_USERNAME }}" --access-key "${{ secrets.LT_ACCESS_KEY }}" --project-id 01M7S4DG4PE128S4KT7FAECK73 --folder-id 01M7SCZZ4PTY0XA7HXMZFYZA31 < /dev/null
      - name: Replay the designed tests
        run: kane-cli testrun run .testmuai/tests --agent --headless < /dev/null | tee kane.ndjson
      - name: Coverage
        if: always()
        run: kane-cli cover gaps < /dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kane-evidence
          path: |
            apps/web/kane.ndjson
            apps/web/dev.log
            apps/web/.testmuai/evidence/
          if-no-files-found: ignore
